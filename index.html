<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FineEli Lab | 시네마틱 영상 프로덕션</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #45a29e;
            --highlight-color: #66fcf1;
            --text-color: #c5c6c7;
            --white: #ffffff;
            --yt-red: #ff0000;
            --font-kr: 'Noto Sans KR', sans-serif;
            --font-en: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-kr);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-img {
            height: 38px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--highlight-color);
        }

        .yt-nav-btn {
            background: rgba(255, 0, 0, 0.15);
            color: #ff4d4d !important;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .yt-nav-btn:hover {
            background: var(--yt-red) !important;
            color: var(--white) !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 70%);
            position: relative;
        }

        .hero-logo {
            max-width: 320px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--accent-color);
